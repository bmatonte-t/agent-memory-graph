name: Code Complexity Metrics

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  code-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Use uv because script has inline dependencies.
      - name: Calculate and compare metrics and display results
        run: |
          uv run --python 3.14 scripts/code_complexity_metrics.py ${{ github.base_ref }} ${{ github.head_ref }}
