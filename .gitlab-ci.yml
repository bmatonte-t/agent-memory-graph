###############################################################################
# GitLab CI pipeline — agent-memory-graph
#
# Stages:
#   1. build    → Docker build + push to Artifact Registry (on all branches)
#   2. plan     → terraform plan (on all branches, dev workspace)
#   3. apply    → terraform apply (on develop → dev, intg branch → intg,
#                 main → prod with human approval)
#
# Required GitLab CI/CD variables (set in project Settings → CI/CD → Variables):
#   TF_STATE_BUCKET         — GCS bucket name for Terraform state
#   GCP_PROJECT_ID_DEV      — GCP project ID for dev workspace
#   GCP_PROJECT_ID_INTG     — GCP project ID for intg workspace
#   GCP_PROJECT_ID_PROD     — GCP project ID for prod workspace
#   GCP_REGION              — Default GCP region (e.g. us-east1)
#   WORKLOAD_IDENTITY_PROVIDER      — Full provider resource name for GitLab OIDC
#                                     (e.g. projects/123/locations/global/workloadIdentityPools/gitlab-ci-pool/providers/gitlab-ci-provider)
#   WORKLOAD_IDENTITY_SERVICE_ACCOUNT — Service account email to impersonate via WIF
#   GOOGLE_CREDENTIALS              — Legacy fallback service account JSON key (deprecated)
#
# The terraform.tfvars is written from CI variables at plan/apply time;
# it is NOT committed to the repository.
###############################################################################

include:
  - project: "latamairlines/data/data-ai-ops/cosmos/cicd-pipelines/base-pipelines"
    ref: main
    file: "/templates/terraform-pipeline.yml"

variables:
  PRODUCT_NAME: "agent-memory-graph"
  TF_WORKING_DIR: "infrastructure/terraform"
  intg_workflow: advana
  intg_environment: "intg"
  approval_on_prod: "true"

# ---------------------------------------------------------------------------
# Docker build and push
#
# Runs before Terraform so the container_image variable is available.
# The image tag uses the commit SHA for traceability + `:latest` for local use.
# ---------------------------------------------------------------------------

build-image:
  stage: .pre
  image: docker:24
  services:
    - docker:24-dind
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://sts.googleapis.com
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - |
      apk add --no-cache curl jq

      if [ -n "${WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${WORKLOAD_IDENTITY_SERVICE_ACCOUNT:-}" ]; then
        echo "Authenticating with Workload Identity Federation"
        STS_RESPONSE=$(curl -s -X POST "https://sts.googleapis.com/v1/token" \
          -H "Content-Type: application/json" \
          -d "{\"audience\":\"//iam.googleapis.com/${WORKLOAD_IDENTITY_PROVIDER}\",\"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\",\"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",\"subjectToken\":\"${GITLAB_OIDC_TOKEN}\"}")
        FEDERATED_ACCESS_TOKEN=$(echo "$STS_RESPONSE" | jq -r '.access_token')

        if [ -z "$FEDERATED_ACCESS_TOKEN" ] || [ "$FEDERATED_ACCESS_TOKEN" = "null" ]; then
          echo "Failed to exchange GitLab OIDC token for federated access token"
          echo "$STS_RESPONSE"
          exit 1
        fi

        IAM_RESPONSE=$(curl -s -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${WORKLOAD_IDENTITY_SERVICE_ACCOUNT}:generateAccessToken" \
          -H "Authorization: Bearer ${FEDERATED_ACCESS_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}')
        GCP_ACCESS_TOKEN=$(echo "$IAM_RESPONSE" | jq -r '.accessToken')

        if [ -z "$GCP_ACCESS_TOKEN" ] || [ "$GCP_ACCESS_TOKEN" = "null" ]; then
          echo "Failed to generate service account access token"
          echo "$IAM_RESPONSE"
          exit 1
        fi

        docker login -u oauth2accesstoken -p "$GCP_ACCESS_TOKEN" \
          "https://${GCP_REGION}-docker.pkg.dev"
      elif [ -n "${GOOGLE_CREDENTIALS:-}" ]; then
        echo "Using legacy GOOGLE_CREDENTIALS fallback"
        echo "$GOOGLE_CREDENTIALS" | docker login -u _json_key --password-stdin \
          "https://${GCP_REGION}-docker.pkg.dev"
      else
        echo "No authentication method configured. Set WIF variables or GOOGLE_CREDENTIALS."
        exit 1
      fi
  script:
    - |
      # Determine project ID based on branch
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        PROJECT_ID="$GCP_PROJECT_ID_PROD"
      elif [ "$CI_COMMIT_BRANCH" = "intg" ]; then
        PROJECT_ID="$GCP_PROJECT_ID_INTG"
      else
        PROJECT_ID="$GCP_PROJECT_ID_DEV"
      fi

      REGISTRY="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/agent-memory-graph"
      IMAGE_TAG="${REGISTRY}/api:${CI_COMMIT_SHA}"
      IMAGE_LATEST="${REGISTRY}/api:latest"

      echo "Building image: $IMAGE_TAG"
      docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .

      echo "Pushing SHA-tagged image..."
      # Capture digest directly from push output (more reliable than inspect)
      PUSH_OUTPUT=$(docker push "$IMAGE_TAG" 2>&1)
      echo "$PUSH_OUTPUT"
      DIGEST=$(echo "$PUSH_OUTPUT" | grep "digest:" | awk '{print $3}')
      if [ -z "$DIGEST" ]; then
        echo "ERROR: could not capture image digest from push output"
        exit 1
      fi
      IMAGE_WITH_DIGEST="${REGISTRY}/api@${DIGEST}"
      echo "Image digest: $IMAGE_WITH_DIGEST"

      echo "Pushing latest tag..."
      docker push "$IMAGE_LATEST"

      # Export for downstream Terraform stages
      echo "TF_VAR_container_image=${IMAGE_WITH_DIGEST}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH'   # Run on all branches

# ---------------------------------------------------------------------------
# Terraform tfvars generation
#
# Writes terraform.tfvars from CI variables before terraform plan/apply.
# This keeps project IDs out of the repository while making them available
# to Terraform at runtime.
#
# This job runs in .pre stage (after build-image) and exposes terraform.tfvars
# as an artifact consumed by downstream Terraform plan/apply jobs.
# ---------------------------------------------------------------------------

write-tfvars:
  stage: .pre
  image: alpine:3
  script:
    - |
      mkdir -p "${TF_WORKING_DIR}"
      cat > "${TF_WORKING_DIR}/terraform.tfvars" <<EOF
      project_id = {
        dev  = "${GCP_PROJECT_ID_DEV}"
        intg = "${GCP_PROJECT_ID_INTG}"
        prod = "${GCP_PROJECT_ID_PROD}"
      }
      spanner_project_id = {
        dev  = "${GCP_PROJECT_ID_DEV}"
        intg = "${GCP_PROJECT_ID_INTG}"
        prod = "${GCP_PROJECT_ID_PROD}"
      }
      spanner_instance_id = {
        dev  = "agent-memory-graph-dev"
        intg = "agent-memory-graph-intg"
        prod = "agent-memory-graph-prod"
      }
      region = {
        dev  = "${GCP_REGION}"
        intg = "${GCP_REGION}"
        prod = "${GCP_REGION}"
      }
      company_id      = "${COMPANY_ID}"
      auth_mode       = "internal"
      container_image = "${TF_VAR_container_image}"
      cicd_sa_email = {
        dev  = "cosmos-cicd-sa@${GCP_PROJECT_ID_DEV}.iam.gserviceaccount.com"
        intg = "cosmos-cicd-sa@${GCP_PROJECT_ID_INTG}.iam.gserviceaccount.com"
        prod = "cosmos-cicd-sa@${GCP_PROJECT_ID_PROD}.iam.gserviceaccount.com"
      }
      agents_group_email = ""
      notification_channels = ${NOTIFICATION_CHANNEL_IDS:-[]}
      EOF
  artifacts:
    paths:
      - ${TF_WORKING_DIR}/terraform.tfvars
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'
  needs:
    - build-image

# ---------------------------------------------------------------------------
# Testing governance enforcement
#
# Blocks new unapproved integration over-mocking violations while allowing
# explicitly approved legacy files during the migration window.
# ---------------------------------------------------------------------------

test-governance-enforce:
  stage: .pre
  image: python:3.14
  script:
    - python scripts/test_suite_governance.py --fail-on-new-violations
  artifacts:
    when: always
    paths:
      - reports/testing-governance-inventory.json
      - reports/testing-governance-inventory.md
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
