# ==> PROJECT INFORMATION
site_name: Agent Memory Graph
site_author: Tryolabs
site_description: Grounded, auditable shared memory for enterprise AI agents.
site_url: https://documentation.tryolabs.com/repo-template
repo_url: https://github.com/tryolabs/repo-template
repo_name: tryolabs/repo-template
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking # Keeps the navigation section open for the current page
    - navigation.path # Shows the breadcrumbs at the top of the page
    - navigation.tabs # Main navigation tabs at the top
    - navigation.expand # Expands all navigation items on the left sidebar by default
    - navigation.top # Back to top button when you scroll up
    - toc.integrate # Integrates the table of contents into the left sidebar
    - content.code.copy # Adds a "copy" button to all code blocks
    - content.code.annotate # Allows for annotating code blocks
    - content.action.edit # Adds an "edit" button to pages
    - content.action.view # Adds a "view source" button to pages
    - search.suggest # Provides search suggestions as you type
    - search.share # Can share the current search query via a button
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - gen-files: # Dynamically generate documentation files during build
      scripts:
        - scripts/generate_api_reference_documentation.py
  - literate-nav: # Use markdown files to define navigation structure
      nav_file: SUMMARY.md
  - section-index # Allow showing an index page when clicking on a folder of doc pages (for __init__.py)
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_toc_entry: true
            merge_init_into_class: true

markdown_extensions:
  - toc:
      permalink: true # Adds icon to headings to get a direct link
  - pymdownx.highlight: # Nicer styling for code blocks
      anchor_linenums: true
      default_lang: python
  - pymdownx.tasklist: # - [ ] clickable task lists.
      custom_checkbox: true
      clickable_checkbox: true
  - admonition # Notes, warnings, etc.
  - pymdownx.details # Collapsible "details" blocks
  - pymdownx.caret # Subscript with ~.
  - pymdownx.mark # Highlight with ==.
  - pymdownx.tilde # Superscript with ^.
  - attr_list # Allows setting attributes on elements with {#id .class key=val}
  - md_in_html # Allows markdown inside HTML blocks.
  - footnotes # Support footnotes with [^1] and [^1]: syntax.
  # Allows for nesting markdown blocks inside each other (e.g., code in admonitions)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex: # Math support
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Concepts:
    - Tripartite Memory: concepts/tripartite-memory.md
    - MindMap Pipeline: concepts/mindmap-pipeline.md
    - Cognitive Weighting: concepts/cognitive-weighting.md
  - Architecture:
    - Overview: architecture.md
    - Decisions: architecture/adr/README.md
    - Spanner Tenancy: architecture/adr/ADR-0001-spanner-tenancy-model.md
    - Synthesis Model Policy: architecture/adr/ADR-0002-synthesis-model-policy.md
    - Audit Export: architecture/adr/ADR-0003-audit-events-export-strategy.md
    - Pruning Scope: architecture/adr/ADR-0004-pruning-threshold-scope.md
  - User Guide:
    - MCP Tools: user-guide/mcp-tools.md
    - REST API: user-guide/api-reference.md
    - Extraction Pipeline: user-guide/extraction-pipeline.md
  - Operations:
    - Deployment: deployment.md
    - Infrastructure: infrastructure.md
    - Deploy Runbook: epic-02-deploy-runbook.md
    - Scheduler Runbook: epic-03-scheduler-runbook.md
    - Incident Protocol: epic-06-slo-incident-protocol.md
  - Adoption:
    - Playbook: epic-07-adoption-playbook.md
    - Checklist: epic-07-onboarding-checklist.md
    - Support Model: epic-07-support-model.md
    - Pilot Report: epic-07-pilot-onboarding-report.md
  - Development:
    - Testing Governance: testing-governance.md
    - Testing Capabilities: testing-capability-matrix.md
    - Testing Health: testing-health-dashboard.md
    - Backlog: backlog.md
    - LATAM Backlog: backlog-latam.md
  - API Reference: api_reference/
